<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 회의실</title>
<style>
  :root {
    --bg: #0f1722; --panel: #16212f; --panel2: #1c2a3b; --line: #2a3a50;
    --text: #e6edf5; --muted: #8a9bb0; --accent: #5eead4; --accent2: #f59e0b;
    --danger: #f87171; --wood: #c89a64; --wood2: #a97c4b; --floor: #d9d2c5; --wall: #b9c7d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #134e4a; border-color: var(--accent); color: var(--accent); font-weight: 600; }
  input, textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  textarea { resize: vertical; }

  header.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header.top b { letter-spacing: .05em; }
  header.top .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); display: inline-block; margin-right: 6px; }
  header.top .crumb { color: var(--muted); font-size: 12px; }
  header.top .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  header.top .status.live { color: var(--danger); }

  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: calc(100vh - 45px); }
  main { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  aside h3 { margin: 6px 0 0; font-size: 13px; }
  aside .row { display: flex; gap: 6px; }
  aside .row > * { flex: 1; }
  .label { font-size: 11px; color: var(--muted); }

  .agenda { display: flex; align-items: flex-end; gap: 10px; }
  .agenda h1 { margin: 0; font-size: 22px; }
  .agenda .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; min-width: 92px; }
  .chip b { display: block; font-size: 12px; }
  .chip span { font-size: 11px; color: var(--muted); }
  .chip.on { background: #134e4a; border-color: var(--accent); }
  .team { display: block; font-size: 10px; font-weight: 600; }

  .room { position: relative; height: 330px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    background: linear-gradient(var(--wall) 0 38%, #9fb0c2 38% 40%, var(--floor) 40%); }
  .room .window { position: absolute; top: 14px; width: 18%; height: 26%; background: linear-gradient(#cfe3f5, #e8f2fb); border: 4px solid #8fa1b5; }
  .room .window::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 48%, #8fa1b5 48% 52%, transparent 52%); }
  .room .plant { position: absolute; bottom: 12px; font-size: 32px; }
  .room .table { position: absolute; left: 50%; top: 58%; width: 46%; height: 34%; transform: translate(-50%, -50%);
    background: radial-gradient(var(--wood), var(--wood2)); border-radius: 50%; box-shadow: 0 8px 0 #7a5633, 0 14px 20px rgba(0,0,0,.25); }
  .room .table::after { content: "📄  ☕  💻  📄"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; opacity: .85; }
  .seat { position: absolute; transform: translate(-50%, -50%); text-align: center; transition: transform .2s; }
  .seat .face { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
    background: #fff; border: 3px solid #445; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .seat .tag { margin-top: 4px; background: #1f2d3d; color: #fff; border-radius: 4px; padding: 1px 7px; font-size: 11px; white-space: nowrap; }
  .seat .tag small { display: block; font-size: 9px; color: var(--accent); }
  .seat .tag .team { display: block; font-size: 9px; font-weight: 600; }
  .seat.speaking { transform: translate(-50%, -50%) scale(1.12); z-index: 2; }
  .seat.speaking .face { border-color: var(--accent); box-shadow: 0 0 0 5px rgba(94,234,212,.35); }
  .bubble { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 6px; background: #fff; color: #222;
    border-radius: 10px; padding: 3px 10px; font-size: 14px; letter-spacing: 2px; display: none; }
  .seat.speaking .bubble { display: block; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateX(-50%) translateY(-3px); } }

  .speech { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 16px; min-height: 130px; }
  .speech .who { display: flex; align-items: center; gap: 10px; }
  .speech .who .face { font-size: 30px; }
  .speech .who b { font-size: 17px; }
  .speech .who .eng { color: var(--muted); font-size: 12px; }
  .speech .who .rec { margin-left: auto; color: var(--danger); font-size: 11px; }
  .speech .text { margin-top: 8px; font-size: 16px; white-space: pre-wrap; }
  .speech.owner { border-left-color: var(--accent2); }

  .board h4, .minutes h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .cards { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 140px; max-width: 260px; }
  .card b { display: block; }
  .card span { font-size: 11px; color: var(--muted); }
  .card.drop b { text-decoration: line-through; color: var(--danger); }
  .empty { color: var(--muted); font-size: 12px; }

  .minutes { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .minutes table { border-collapse: collapse; margin: 8px 0; }
  .minutes td, .minutes th { border: 1px solid var(--line); padding: 4px 8px; }
  .minutes h2 { font-size: 15px; margin: 14px 0 4px; color: var(--accent); }

  .log { flex: 1; min-height: 120px; max-height: 40vh; overflow: auto; }
  .log .item { margin-bottom: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; cursor: pointer; }
  .log .item b { display: block; }
  .log .item span { color: var(--muted); font-size: 11px; }
  .log .item.k-summary { border-color: var(--accent); }
  .log .item.k-owner { border-color: var(--accent2); }
  .log .item.k-archive { border-color: #fbbf24; }
  .teams { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .teams .t { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; padding: 6px 8px; }
  .teams .t b { color: var(--c); }
  .teams .t div { color: var(--muted); font-size: 11px; }
  .teams .src { font-size: 11px; }
  .teams .src.bad { color: var(--danger); }
  .err { color: var(--danger); font-size: 12px; min-height: 1em; }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .room { height: 280px; }
    .seat .face { width: 42px; height: 42px; font-size: 22px; }
    .room .plant { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <b><span class="dot"></span><span id="company">COMPANY</span></b>
  <span class="crumb">회의실 / 기록</span>
  <span class="status" id="status">대기</span>
</header>

<div class="wrap">
  <main>
    <div class="agenda">
      <h1 id="title">안건을 정하고 회의를 시작하세요</h1>
      <span class="meta" id="meta"></span>
    </div>
    <div class="chips" id="chips"></div>

    <div class="room" id="room">
      <div class="window" style="left:8%"></div>
      <div class="window" style="left:41%"></div>
      <div class="window" style="left:74%"></div>
      <div class="plant" style="left:2%">🪴</div>
      <div class="plant" style="right:2%">🪴</div>
      <div class="table"></div>
    </div>

    <div class="speech" id="speech">
      <div class="empty">발언이 여기에 나옵니다.</div>
    </div>

    <div class="board">
      <h4>후보 보드</h4>
      <div class="cards" id="board"><span class="empty">대표가 라운드마다 후보안을 정리합니다.</span></div>
    </div>

    <div class="minutes" id="conclusion" hidden>
      <h4>결론</h4>
      <div id="conclusionBody"></div>
    </div>

    <div class="minutes" id="archive" hidden>
      <h4>자료 정리 · 보관</h4>
      <div id="archiveBody"></div>
    </div>
  </main>

  <aside>
    <h3>회의 관리</h3>
    <div>
      <div class="label">안건</div>
      <textarea id="topic" rows="2" placeholder="예: 100만 원 수익화 방안"></textarea>
    </div>
    <div class="row">
      <div>
        <div class="label">라운드</div>
        <select id="rounds"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select>
      </div>
      <div>
        <div class="label">재생 속도</div>
        <select id="speed"><option value="25">1×</option><option value="8">3×</option><option value="0">즉시</option></select>
      </div>
    </div>
    <button class="primary" id="start">회의 시작</button>
    <div class="row">
      <button id="pause">일시정지</button>
      <button id="stop">회의 중단</button>
    </div>

    <h3>부서</h3>
    <div class="teams" id="teams"></div>

    <h3>대표 지시</h3>
    <div class="row">
      <input id="say" placeholder="예: 강의류는 제외해">
      <button id="sayBtn" style="flex:0 0 auto">전달</button>
    </div>
    <div class="err" id="err"></div>

    <h3>기록 <span class="label" id="count"></span></h3>
    <div class="log" id="log"></div>
    <button id="export">JSON 내보내기</button>
    <div class="label" id="outDir"></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const STATUS = { idle: "대기", running: "● REC 회의 중", paused: "일시정지", done: "회의 종료", stopped: "중단됨", error: "오류" };

let S = null;
let shown = 0;          // 화면에 다 보여준 기록 수
let typing = null;      // 타자 효과 타이머
let pinned = null;      // 기록에서 눌러 본 발언 (없으면 최신 발언)
let seatsBuilt = false;

function member(id) { return S.roster.members.find((m) => m.id === id); }
function teamColor(team) { return S.roster.teams?.[team]?.color || "var(--accent)"; }
function teamTag(team) { return team ? `<span class="team" style="color:${esc(teamColor(team))}">${esc(team)}</span>` : ""; }

function buildSeats() {
  const room = $("room");
  const ms = S.roster.members;
  const chairIdx = ms.findIndex((m) => m.id === S.roster.chair);
  const order = [ms[chairIdx], ...ms.filter((_, i) => i !== chairIdx)];
  order.forEach((m, i) => {
    // 대표는 위 가운데, 나머지는 타원을 따라 시계 방향
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / order.length;
    const el = document.createElement("div");
    el.className = "seat";
    el.id = "seat-" + m.id;
    el.style.left = 50 + 33 * Math.cos(a) + "%";
    el.style.top = 58 + 32 * Math.sin(a) + "%";
    el.innerHTML = `<div class="bubble">···</div><div class="face">${esc(m.avatar || "🙂")}</div>
      <div class="tag">${teamTag(m.team)}${esc(m.role)} · ${esc(m.name)}<small>${esc(S.engines[m.ai] || m.ai)}</small></div>`;
    room.appendChild(el);
  });
  seatsBuilt = true;
}

function render() {
  $("company").textContent = S.roster.company;
  const st = $("status");
  st.textContent = (STATUS[S.status] || S.status) + (S.dryRun ? " (DRY_RUN)" : "");
  st.className = "status" + (S.status === "running" ? " live" : "");
  if (S.topic) $("title").textContent = S.topic;
  if (S.topic && !$("topic").value) $("topic").value = S.topic;
  $("meta").textContent = S.status === "idle" ? "" : `R${S.round} / ${S.rounds} · 발언 ${S.log.filter((l) => l.kind === "speech").length}회`;

  $("chips").innerHTML = S.roster.members.map((m) =>
    `<div class="chip ${S.speaker === m.id ? "on" : ""}">${teamTag(m.team)}<b>${esc(m.role)}</b><span>${esc(m.name)}</span></div>`).join("");

  $("teams").innerHTML = Object.entries(S.roster.teams || {}).map(([name, t]) => {
    const people = S.roster.members.filter((m) => m.team === name).map((m) => m.role + " " + m.name).join(", ");
    const src = (S.sources[name] || []).map((x) => `<div class="src ${x.ok ? "" : "bad"}" title="${esc(x.error || "")}">${x.ok ? "✔" : "✖"} ${esc(x.label)}</div>`).join("");
    const planned = !S.sources[name] && t.sources?.length ? `<div>자료 ${t.sources.length}개 (회의 시작 때 읽음)</div>` : "";
    return `<div class="t" style="--c:${esc(teamColor(name))}"><b>${esc(name)}</b> <span class="label">${esc(people)}</span><div>${esc(t.desc || "")}</div>${src}${planned}</div>`;
  }).join("");

  if (!seatsBuilt) buildSeats();
  for (const m of S.roster.members) $("seat-" + m.id).classList.toggle("speaking", S.speaker === m.id);

  $("board").innerHTML = S.board.length
    ? S.board.map((c) => `<div class="card ${c.status}"><b>${esc(c.name)}</b><span>${c.status === "drop" ? "제외 · " : ""}${esc(c.note)}</span></div>`).join("")
    : `<span class="empty">대표가 라운드마다 후보안을 정리합니다.</span>`;

  const active = S.status === "running" || S.status === "paused";
  $("start").disabled = active;
  $("start").textContent = S.log.length && !active ? "새 회의 시작" : "회의 시작";
  $("pause").disabled = !active;
  $("pause").textContent = S.status === "paused" ? "다시 시작" : "일시정지";
  $("stop").disabled = !active;
  $("sayBtn").disabled = !active;
  $("export").disabled = !S.log.length;
  $("err").textContent = S.error || "";
  $("outDir").textContent = S.outDir ? "저장: " + S.outDir : "";

  $("count").textContent = S.log.length ? `${S.log.length}건` : "";
  $("log").innerHTML = S.log.map((l, i) =>
    `<div class="item k-${l.kind}" data-i="${i}"><b>R${l.round} · ${esc(l.role)} ${esc(l.name)}${l.kind === "summary" ? " (정리)" : l.kind === "conclusion" ? " (결론)" : l.kind === "archive" ? " (자료정리)" : ""}</b>
     <span>${esc(l.text.slice(0, 60))}${l.text.length > 60 ? "…" : ""}</span></div>`).join("");
  $("log").scrollTop = $("log").scrollHeight;

  $("archive").hidden = !S.archive;
  if (S.archive) $("archiveBody").innerHTML = markdown(S.archive);
  $("conclusion").hidden = !S.conclusion;
  if (S.conclusion) $("conclusionBody").innerHTML = markdown(S.conclusion);

  // 새 발언이 생겼으면 타자 효과로 보여줌
  if (S.log.length < shown) shown = 0; // 새 회의
  if (S.log.length > shown && !pinned) { shown = S.log.length; showSpeech(S.log[shown - 1], true); }
  if (!S.log.length) $("speech").innerHTML = `<div class="empty">발언이 여기에 나옵니다.</div>`;
}

function showSpeech(l, animate) {
  clearInterval(typing);
  const m = member(l.id);
  const box = $("speech");
  box.className = "speech" + (l.kind === "owner" ? " owner" : "");
  const label = l.kind === "summary" ? "라운드 정리" : l.kind === "conclusion" ? "결론 (아래 참고)" : l.kind === "archive" ? "자료 정리 (아래 참고)" : "";
  box.innerHTML = `<div class="who"><span class="face">${l.kind === "owner" ? "🫵" : esc(m?.avatar || "🙂")}</span>
    <div>${teamTag(l.team)}<b>${esc(l.role)} · ${esc(l.name)}</b><div class="eng">${l.engine ? esc(S.engines[l.engine] || l.engine) : "대표(나)"} ${label ? "· " + label : ""}</div></div>
    ${S.status === "running" ? '<span class="rec">● REC</span>' : ""}</div><div class="text"></div>`;
  const text = l.kind === "conclusion" ? "회의를 마칩니다. 결론 보고서를 정리했습니다." :
    l.kind === "archive" ? "회의 내용 정리해서 보관했습니다. 쓸 소스랑 보류한 아이디어 목록 아래에 있어요." : l.text;
  const out = box.querySelector(".text");
  const delay = Number($("speed").value);
  if (!animate || !delay) { out.textContent = text; return; }
  let i = 0;
  typing = setInterval(() => {
    i += 2;
    out.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(typing);
  }, delay);
}

// 결론 보고서용 아주 작은 마크다운 변환 (제목, 표, 목록, 굵게)
function markdown(md) {
  const lines = esc(md).split("\n");
  let html = "", inList = false, table = [];
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\|?\s*:?-{2,}/.test(r)).map((r) => r.replace(/^\s*\||\|\s*$/g, "").split("|"));
    html += "<table>" + rows.map((r, i) => "<tr>" + r.map((c) => `<${i ? "td" : "th"}>${inline(c.trim())}</${i ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>";
    table = [];
  };
  for (const line of lines) {
    if (/^\s*\|.*\|\s*$/.test(line)) { table.push(line); continue; }
    flushTable();
    const li = line.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)/);
    if (!li && inList) { html += "</ul>"; inList = false; }
    let m;
    if ((m = line.match(/^#{1,6}\s+(.*)/))) html += `<h2>${inline(m[1])}</h2>`;
    else if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; }
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  flushTable();
  if (inList) html += "</ul>";
  return html;
}

async function post(url, data) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data || {}) });
  const j = await res.json().catch(() => ({}));
  $("err").textContent = res.ok ? "" : j.error || "요청 실패";
  return res.ok;
}

$("start").onclick = () => { pinned = null; post("/api/start", { topic: $("topic").value, rounds: $("rounds").value }); };
$("pause").onclick = () => post(S.status === "paused" ? "/api/resume" : "/api/pause");
$("stop").onclick = () => confirm("회의를 중단할까요? 지금까지 기록은 저장됩니다.") && post("/api/stop");
const say = async () => { if (await post("/api/say", { text: $("say").value })) $("say").value = ""; };
$("sayBtn").onclick = say;
$("say").onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) say(); };
$("export").onclick = () => { location.href = "/api/export"; };
$("log").onclick = (e) => {
  const item = e.target.closest(".item");
  if (!item) return;
  const i = Number(item.dataset.i);
  pinned = i === S.log.length - 1 ? null : i; // 마지막 발언을 누르면 다시 실시간으로
  showSpeech(S.log[i], false);
};

const es = new EventSource("/api/events");
es.addEventListener("state", (e) => { S = JSON.parse(e.data); render(); });
es.onerror = () => { $("status").textContent = "서버 연결 끊김 — 터미널에서 ai meeting 을 다시 실행하세요"; };
</script>
</body>
</html>
